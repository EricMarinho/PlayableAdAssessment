<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Scrambly Tap & Reward - playable ad demo" />
    <title>Scrambly Playable</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <div id="game-ui">
        <div class="bokeh bokeh--a" aria-hidden="true"></div>
        <div class="bokeh bokeh--b" aria-hidden="true"></div>
        <!-- toast kept inside #game-ui to avoid viewport clipping (WP-1) -->
        <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
        <div id="hud">
          <span id="timer" role="timer" aria-live="off">30s</span>
          <span id="tap-count" aria-live="polite">0</span>
        </div>
        <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" aria-label="Progress">
          <div id="progress-fill"></div>
        </div>
        <button id="fox-btn" type="button" aria-label="Tap the fox to earn points">
          <img
            src="./scrambly-fox-reference.webp"
            alt="Scrambly fox mascot holding a purple gaming controller with orange coins"
            width="294"
            height="320"
            decoding="async"
          />
        </button>
        <p>Scrambly - Tap &amp; Reward (demo)</p>
      </div>
      <!-- fx-canvas pointer-events none overlay -->
      <canvas id="fx-canvas" aria-hidden="true"></canvas>
      <div id="start-screen" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <div class="card">
          <h1 id="start-title">Tap to Start</h1>
          <p>Warm, rounded Scrambly demo - tap the fox to earn demo coins!</p>
          <button id="start-btn" type="button">Tap to Start</button>
        </div>
      </div>
      <div id="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
        <div class="card">
          <h2 id="end-title">You Did It!</h2>
          <p id="end-stats" aria-live="polite"></p>
          <button id="explore-btn" type="button">Explore Scrambly</button>
          <button id="play-again-btn" type="button">Play Again</button>
          <p id="cta-confirm" hidden>CTA clicked — demo only</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
